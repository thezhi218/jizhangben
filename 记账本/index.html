<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="app">
    <!-- ====== ①顶部标题栏 ====== -->
    <div class="header">
      <h1>💰 个人记账本</h1>
      <p id="headerMonth">2026年7月</p>
    </div>

    <!-- ====== ②三张统计卡片 ====== -->
    <div class="summary">
      <div class="card">
        <span>本月收入</span>
        <span id="monthIncome">¥0</span>
      </div>
      <div class="card">
        <span>本月支出</span>
        <span id="monthExpense">¥0</span>
      </div>
      <div class="card">
        <span>本月结余</span>
        <span id="monthBalance">¥0</span>
      </div>
    </div>

    <!-- ====== ③记账表单 ====== -->
    <div class="form-area">
      <h2>记一笔</h2>

      <label>类型：</label>
      <select id="typeSelect">
        <option value="">请选择</option>
        <option value="income">收入</option>
        <option value="expense">支出</option>
      </select>

      <label>分类：</label>
      <select id="categorySelect">
        <option value="">请选择</option>
        <optgroup label="收入分类">
          <option value="工资">工资</option>
          <option value="兼职">兼职</option>
          <option value="理财">理财</option>
        </optgroup>
        <optgroup label="支出分类">
          <option value="餐饮">餐饮</option>
          <option value="交通">交通</option>
          <option value="购物">购物</option>
          <option value="娱乐">娱乐</option>
          <option value="居住">居住</option>
        </optgroup>
      </select>

      <label>金额：</label>
      <input type="number" id="amountInput" placeholder="0.00" step="0.01">

      <label>日期：</label>
      <input type="date" id="dateInput">

      <label>备注：</label>
      <input type="text" id="noteInput" placeholder="写点什么…（选填）">

      <button id="submitBtn">✓ 记一笔</button>
    </div>

    <!-- ====== ④账单列表 ====== -->
    <div class="list-area">
      <h2>账单记录</h2>

      <table>
        <thead>
          <tr>
            <th>日期</th>
            <th>分类</th>
            <th>备注</th>
            <th>金额</th>
            <th>操作</th>
          </tr>
        </thead>
        <tbody>
          <tr>
            <td colspan="5">暂无记录</td>
          </tr>
        </tbody>
      </table>
    </div>
  </div>
  <script src="app.js"></script>
</body>
</html>
